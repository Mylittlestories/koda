name: Deploy web app to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site (landing page as root, app at /app.html)
        run: |
          mkdir -p _site
          # Landing page is the front door…
          cp landing.html _site/index.html
          # …the app lives at /app.html (index.html stays the app locally)
          cp index.html _site/app.html
          # PWA files (patch paths so they point at the deployed app)
          cp packaging/pwa/manifest.webmanifest _site/manifest.webmanifest 2>/dev/null || true
          cp packaging/pwa/sw.js _site/sw.js 2>/dev/null || true
          cp packaging/pwa/icon-192.png _site/icon-192.png 2>/dev/null || true
          cp packaging/pwa/icon-512.png _site/icon-512.png 2>/dev/null || true
          cp docs/koda-logo.png _site/koda-logo.png 2>/dev/null || true
          # PWA start_url + cached entry point → the deployed app file
          sed -i 's|"start_url": "./index.html"|"start_url": "./app.html"|' _site/manifest.webmanifest 2>/dev/null || true
          sed -i "s|\./index\.html|./app.html|g" _site/sw.js 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
